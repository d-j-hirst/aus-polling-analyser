name: Core CLI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check CLI dependency boundary
        run: python3 tests/check_cli_dependencies.py

      - name: Test analysis metadata tools
        working-directory: analysis
        run: python3 -B -m unittest test_election_data.py test_election_store.py test_election_analysis.py test_region_model.py test_region_model_provenance.py test_pipeline_registry.py test_pipeline.py test_source_provenance.py test_generated_provenance.py test_provenance_maintenance.py test_calibration_provenance.py test_pollster_analysis.py test_pollster_analysis_provenance.py test_approvals.py test_approvals_provenance.py test_fp_model_provenance.py test_fp_model_cutoffs.py test_trend_adjust.py test_trend_adjust_cutoffs.py test_trend_adjust_provenance.py test_analysis_provenance.py test_run_fp_model.py

      - name: Build CLI
        run: CXX=g++ sh build-polling-cli.sh

      - name: Run portable tests
        run: CXX=g++ sh run-portable-tests.sh

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check CLI dependency boundary
        shell: cmd
        run: python tests\check_cli_dependencies.py

      - name: Test analysis metadata tools
        working-directory: analysis
        shell: cmd
        run: python -B -m unittest test_election_data.py test_election_store.py test_election_analysis.py test_region_model.py test_region_model_provenance.py test_pipeline_registry.py test_pipeline.py test_source_provenance.py test_generated_provenance.py test_provenance_maintenance.py test_calibration_provenance.py test_pollster_analysis.py test_pollster_analysis_provenance.py test_approvals.py test_approvals_provenance.py test_fp_model_provenance.py test_fp_model_cutoffs.py test_trend_adjust.py test_trend_adjust_cutoffs.py test_trend_adjust_provenance.py test_analysis_provenance.py test_run_fp_model.py

      - name: Build CLI
        shell: cmd
        run: build-polling-cli.cmd

      - name: Run portable tests
        shell: cmd
        run: run-portable-tests.cmd
